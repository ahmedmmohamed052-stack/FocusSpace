<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FocusSpace — My Scores</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css"/>
<!-- Firebase Auth guard: redirects to login.html if not signed in / not verified -->
<script type="module" src="assets/auth-guard.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#F5F3FF;color:#18102E;min-height:100vh;padding:32px 18px 60px;}
  .wrap{max-width:720px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:#6B5B8E;font-weight:700;font-size:13px;text-decoration:none;margin-bottom:20px;}
  .back-link:hover{color:#6F42FF;}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px;}
  p.sub{color:#6B5B8E;font-weight:500;margin-bottom:24px;font-size:14px;}

  .hero{background:linear-gradient(135deg,#6F42FF,#FF4D8D);border-radius:22px;padding:26px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;box-shadow:0 8px 30px rgba(111,66,255,0.28);}
  .hero-label{font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;opacity:0.85;margin-bottom:6px;}
  .hero-value{font-family:'Bricolage Grotesque',sans-serif;font-size:40px;font-weight:800;letter-spacing:-0.02em;}
  .hero-icon{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:26px;}

  .empty{text-align:center;padding:60px 20px;color:#A898C8;font-weight:600;}
  .empty i{font-size:40px;display:block;margin-bottom:14px;}

  .session{background:#fff;border:1px solid rgba(214,205,240,0.65);border-radius:18px;margin-bottom:12px;overflow:hidden;}
  .session-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;}
  .session-score{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;font-family:'Bricolage Grotesque',sans-serif;}
  .session-info{flex:1;min-width:0;}
  .session-title{font-weight:700;font-size:14px;margin-bottom:2px;}
  .session-meta{font-size:12px;color:#A898C8;font-weight:600;}
  .session-chevron{color:#A898C8;transition:transform 0.2s;flex-shrink:0;}
  .session.open .session-chevron{transform:rotate(180deg);}
  .session-body{display:none;padding:0 18px 16px;border-top:1px solid rgba(214,205,240,0.4);}
  .session.open .session-body{display:block;padding-top:12px;}
  .task-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;}
  .task-row .check{width:18px;height:18px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .task-row .done{background:linear-gradient(135deg,#6F42FF,#FF4D8D);color:#fff;}
  .task-row .undone{background:#EDE8FF;color:#A898C8;}
  .task-name{flex:1;}
  .task-dur{color:#A898C8;font-weight:600;font-size:11px;}
  .loading{text-align:center;color:#6B5B8E;font-weight:600;padding:40px;}
</style>
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="back-link"><i class="ti ti-arrow-left"></i> Back to Home</a>
    <h1>My Scores</h1>
    <p class="sub">Every focus session you've completed, and how you did.</p>

    <div class="hero">
      <div>
        <div class="hero-label">Total Score</div>
        <div class="hero-value" id="totalScore">—</div>
      </div>
      <div class="hero-icon"><i class="ti ti-star-filled"></i></div>
    </div>

    <div id="list"><div class="loading">Loading your sessions…</div></div>
  </div>

<script>
  function fmtDate(ts) {
    if (!ts) return "";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) +
      " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  function scoreColor(sc) {
    if (sc >= 80) return { bg: "#EDE8FF", fg: "#6F42FF" };
    if (sc >= 60) return { bg: "#FFF0D6", fg: "#7A4400" };
    return { bg: "#FFE8F2", fg: "#A0164A" };
  }

  async function init() {
    await window.FS.ready;
    const [stats, sessions] = await Promise.all([
      window.FS.getUserStats(),
      window.FS.getSessionHistory(100),
    ]);

    document.getElementById("totalScore").textContent = (stats.totalScore || 0).toLocaleString();

    const listEl = document.getElementById("list");
    if (!sessions.length) {
      listEl.innerHTML = `<div class="empty"><i class="ti ti-mood-empty"></i>No sessions yet — finish a Focus Space session to see it here.</div>`;
      return;
    }

    listEl.innerHTML = sessions.map((s, i) => {
      const c = scoreColor(s.score);
      const tasksHtml = (s.tasks || []).map(t => `
        <div class="task-row">
          <div class="check ${t.done ? "done" : "undone"}">${t.done ? '<i class="ti ti-check" style="font-size:11px"></i>' : ""}</div>
          <span class="task-name" style="${t.done ? "" : "color:#A898C8;text-decoration:line-through;"}">${escapeHtml(t.name)}</span>
          <span class="task-dur">${t.dur}m</span>
        </div>
      `).join("");

      return `
        <div class="session" id="session-${i}">
          <div class="session-head" onclick="document.getElementById('session-${i}').classList.toggle('open')">
            <div class="session-score" style="background:${c.bg};color:${c.fg}">${s.score}</div>
            <div class="session-info">
              <div class="session-title">${escapeHtml(s.field || "General")} · ${escapeHtml(s.sub || "General")}</div>
              <div class="session-meta">${fmtDate(s.createdAt)} · ${s.tasksDone}/${s.tasksTotal} tasks · ${s.actualMinutes}m</div>
            </div>
            <i class="ti ti-chevron-down session-chevron"></i>
          </div>
          <div class="session-body">${tasksHtml || '<div style="color:#A898C8;font-size:13px">No tasks recorded.</div>'}</div>
        </div>
      `;
    }).join("");
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  init().catch(e => {
    console.error("[scores] failed:", e.message);
    document.getElementById("list").innerHTML = `<div class="empty"><i class="ti ti-alert-triangle"></i>Couldn't load your sessions. Please refresh.</div>`;
  });
</script>
</body>
</html>
